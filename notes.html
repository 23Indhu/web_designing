<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
div {
  margin-bottom: 15px;
  padding: 4px 12px;
}

.danger {
 background-color: #c508b5;
  border-left: 6px solid #e70c1e;
}


.success {
  background-color: #ece808;
  border-left: 6px solid #5aeef3;
}

.info {
  background-color: #f74012;
  border-left: 6px solid #f7ea3b;
}


.warning {
  background-color: #055d97;
  border-left: 6px solid #07e069;
}
</style>
</head>
<body>

<h2>Notes</h2>
<div class="danger">
  <p><strong>Danger!</strong> Some text...</p>
</div>

<div class="success">
  <p><strong>Success!</strong> Some text...</p>
</div>

<div class="info">
  <p><strong>Info!</strong> Some text...</p>
</div>

<div class="warning">
  <p><strong>Warning!</strong> Some text...</p>
</div>

</body>
</html>
